<section class="page-h"><div class="wrap"><h1>클럽 찾기</h1><p>지역을 고르세요. 목록은 학부모·클럽의 제보로 채워지고 운영팀이 확인한 뒤 게시됩니다. 평가·순위는 없고 사실 정보만 있습니다.</p></div></section>
<section class="section"><div class="wrap">
<div class="filters" id="regions"><button class="chip" aria-pressed="true" data-r="">전체</button></div>
<div class="list" id="clubs"><div class="empty">불러오는 중…</div></div>
<p class="note">다니는 클럽이 없거나 정보가 다르면 <a href="/submit/?type=club">제보</a>해 주세요. 클럽·코치가 직접 등록해도 됩니다(무료).</p>
</div></section>

<script src="/assets/cm.js?v=1"></script>
<script>
(async()=>{const box=document.getElementById('clubs'),rb=document.getElementById('regions');let all=[];
try{all=await CM.get('cm_clubs_public','select=*&order=premium.desc,region.asc,name.asc');}catch(e){box.innerHTML='<div class="empty">잠시 후 다시 시도해 주세요.</div>';return;}
const regs=[...new Set(all.map(c=>c.region))];regs.forEach(r=>{const b=document.createElement('button');b.className='chip';b.dataset.r=r;b.textContent=r+' ('+all.filter(c=>c.region===r).length+')';b.setAttribute('aria-pressed','false');rb.appendChild(b);});
function render(r){const list=r?all.filter(c=>c.region===r):all;box.innerHTML=list.length?list.map(CM.clubItem).join(''):'<div class="empty">이 지역은 아직 제보가 없어요. <a href="/submit/?type=club">첫 제보</a>를 부탁드려요.</div>';}
rb.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;rb.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');render(b.dataset.r);});
render('');})();
</script>
