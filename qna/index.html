<section class="page-h"><div class="wrap"><h1>질문과 답</h1><p>부모들이 실제로 묻는 것들. 운영팀이 근거와 함께 1차 답을 달고, 확인된 코치의 답변이 붙습니다. 모든 답은 일반 안내이며 진단이나 특정 클럽 추천이 아닙니다.</p></div></section>

<div class="filters" id="cats"><button class="chip" aria-pressed="true" data-c="">전체</button></div>
<div class="list" id="qna"><div class="empty">불러오는 중…</div></div>

<script src="/assets/cm.js?v=1"></script>
<script>
(async()=>{const box=document.getElementById('qna'),cb=document.getElementById('cats');let all=[];
try{all=await CM.get('cm_questions_public','select=*&order=created_at.desc&limit=200');}catch(e){box.innerHTML='<div class="empty">잠시 후 다시 시도해 주세요.</div>';return;}
Object.entries(CM.CAT).forEach(([k,v])=>{const n=all.filter(q=>q.category===k).length;if(!n)return;const b=document.createElement('button');b.className='chip';b.dataset.c=k;b.textContent=v+' ('+n+')';b.setAttribute('aria-pressed','false');cb.appendChild(b);});
function render(c){const list=c?all.filter(q=>q.category===c):all;box.innerHTML=list.length?list.map(CM.qaItem).join(''):'<div class="empty">아직 없어요.</div>';}
cb.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cb.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');render(b.dataset.c);});
render('');})();
</script>
