<script>
(async()=>{const t=new Date().toISOString().slice(0,10);try{const up=await CM.get('cm_events_public','select=*&start_date=gte.'+t+'&order=start_date.asc');const past=await CM.get('cm_events_public','select=*&start_date=lt.'+t+'&order=start_date.desc&limit=30');
document.getElementById('up').innerHTML=up.length?up.map(e=>CM.eventItem(e,false)).join(''):'<div class="empty">예정된 대회가 아직 없어요. 참가 요강을 받으셨다면 <a href="/submit/?type=event">제보</a>해 주세요.</div>';
document.getElementById('past').innerHTML=past.length?past.map(e=>CM.eventItem(e,true)).join(''):'<div class="empty">없음</div>';}catch(e){document.getElementById('up').innerHTML='<div class="empty">잠시 후 다시 시도해 주세요.</div>';document.getElementById('past').innerHTML='';}})();
</script>
